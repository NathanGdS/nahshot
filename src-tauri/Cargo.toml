[package]
name = "nahshot"
version = "0.1.0"
description = "Screenshot tool for Windows with an organized gallery"
edition = "2021"

[lib]
name = "nahshot_app"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
arboard = "3.7.0"
chrono = "0.4.45"
dirs = "6.0.0"
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.35"
nahshot-capture = { path = "../crates/nahshot-capture" }
nahshot-core = { path = "../crates/nahshot-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"

[dev-dependencies]
tempfile = "3.27.0"
windows-sys = { version = "0.61", features = ["Win32_System_Registry"] }
