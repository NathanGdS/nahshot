<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <title>nahshot</title>
    <script type="module" src="/src/gallery.ts"></script>
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" class="sidebar" data-i18n-aria-label="gallery.navigation"></aside>
      <main class="main">
        <header class="toolbar">
          <div class="toolbar-title">
            <h1 id="title"></h1>
            <span id="subtitle" class="toolbar-subtitle"></span>
          </div>
          <label class="search">
            <span id="search-icon"></span>
            <input id="search" type="search" data-i18n-placeholder="gallery.search" spellcheck="false" autocomplete="off" />
          </label>
          <button id="sort" class="btn btn-ghost sort" type="button"></button>
          <div id="selbar" class="selbar" role="toolbar" data-i18n-aria-label="gallery.selectionActions" hidden></div>
        </header>
        <div id="content" class="content">
          <div id="grid" class="grid"></div>
        </div>
      </main>
    </div>
  </body>
</html>
