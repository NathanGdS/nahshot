[package]
name = "nahshot-core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
