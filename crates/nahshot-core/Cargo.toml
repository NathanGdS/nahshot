[package]
name = "nahshot-core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
trash = "5.2.9"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
