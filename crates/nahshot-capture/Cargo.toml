[package]
name = "nahshot-capture"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.45"
fontdue = "0.9.5"
global-hotkey = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.35"
softbuffer = "0.4.8"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }
winit = "0.30.13"
xcap = "0.9.8"

[dev-dependencies]
env_logger = "0.11.11"
